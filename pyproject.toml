[project]
name = "stcg"
version = "0.1.0"
description = "Evaluation of post-estimation aggregation in dynamic graph recovery."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "torch>=2.1",
    "tigramite>=5.2.10",
    "statsmodels>=0.14",
    "ortools>=9.10",
    "ruptures>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
