# Prespecified secondary robustness study B. No execution before protocol freeze.
study: information_sciences_schedule_robustness_v1
threads: 1
seed_start: 60000
seed_count: 50
durations: [300, 600]
schedules: [fixed_phase, random_phase, irregular]
mechanism:
  n_nodes: 8
  timesteps: 3600
  max_lag: 3
  edge_prob: 0.18
  n_states: 2
  overlap: 0.5
  effect_scale: 1.0
  noise_scale: 0.10
  observation_noise: 0.0
  noise_kind: gaussian
  burn_in: 100
window:
  size: 300
  stride: 150
model:
  scorer: lasso
  lasso_alpha: 0.005
  n_init: 10
statistics:
  bootstrap_draws: 10000
  bootstrap_seed: 20261024
  minimum_ci_n: 5
  alpha: 0.05
